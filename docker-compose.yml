version: '3.8'

services:
  client-service:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bank-client-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - SERVER_PORT=8001
    networks:
      - bank-network

  account-service:
    build:
      context: ./account
      dockerfile: Dockerfile
    container_name: bank-account-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SERVER_PORT=8000
      - CLIENT_SERVICE_URL=http://client-service:8001/api/clients
    depends_on:
      - client-service
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge
